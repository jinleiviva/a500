name: A500 红利低波数据更新

on:
  schedule:
    # 北京 15:50（UTC 7:50），收盘后；错开 daily(15:31) 与 realtime(9:00-15:00)
    - cron: '50 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 与日频 / 实时 workflow 共用写锁，避免同时 push 到 main 撞车
concurrency:
  group: a500-write
  cancel-in-progress: false

jobs:
  dividend:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare numpy pandas requests

      - name: 抓取红利低波数据
        run: python fetch_dividend_data.py
        env:
          NO_PROXY: '*'

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name 'a500-bot'
          git config user.email 'a500-bot@users.noreply.github.com'
          git add dividend_data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "📊 红利低波数据更新 $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true
          git push
