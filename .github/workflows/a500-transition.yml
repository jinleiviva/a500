name: A500 经济健康度数据更新

on:
  schedule:
    # 北京 17:00（UTC 9:00），周一；宏观指标多为月度，周频足够且避开交易时段
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# 与日频 / 实时 / 红利 workflow 共用写锁，避免同时 push 到 main 撞车
concurrency:
  group: a500-write
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare numpy pandas requests

      - name: 抓取经济健康度数据
        run: python fetch_transition_data.py
        env:
          NO_PROXY: '*'

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name 'a500-bot'
          git config user.email 'a500-bot@users.noreply.github.com'
          git add transition_data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "📊 经济健康度数据更新 $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true
          git push
